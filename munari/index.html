<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f6ef">
<title>Happy Birthday, Bruno Munari!</title>
<style>
:root{--wall:#f8f6ef;--paper:#fffefd}
*{box-sizing:border-box}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
html,body{margin:0;min-height:100%;background:var(--wall)}
body{overflow-x:hidden}
main{min-height:100svh;display:grid;place-items:center;padding:clamp(10px,1vw,16px)}
/* The desktop composition responds to both window width and available height. */
svg.cover{display:block;width:min(96%,1495px,calc((100svh - 34px) * 1.717647));height:auto;overflow:visible;-webkit-user-select:none;user-select:none}
svg.cover .constellation,svg.cover .lettering{transition:transform .35s ease-out}
svg.cover .constellation{transform-origin:390px 193px;transform:scale(.968)}
/* Hand-drawn Happy and Bruno Munari; upright printed type acts as the unexpected third voice. */
.day-word{fill:#191919;font-family:'Futura','Avenir Next','Helvetica Neue',Arial,sans-serif;font-size:28px;font-weight:700;font-style:normal;letter-spacing:-.035em;pointer-events:none}
.date-imprint{fill:#969696;font-family:'Futura','Avenir Next','Helvetica Neue',Arial,sans-serif;font-size:9.6px;font-weight:500;letter-spacing:.30px;pointer-events:none;transform:translateY(0)}
/* Keep the small imprint monochrome: graphite from the original sketch. */
.printed-age{font-size:inherit;letter-spacing:inherit}
/* One infinity sign, two secret actions. No surrounding UI. */
.date-imprint .infinity-stroke{fill:none;stroke:#d2c094;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;transition:stroke .24s ease}
.date-imprint .infinity-loop{cursor:pointer;fill:transparent;pointer-events:all;touch-action:manipulation;outline:none;-webkit-tap-highlight-color:transparent}
.date-imprint:has(.infinity-loop:hover) .infinity-stroke,
.date-imprint:has(.infinity-loop:focus-visible) .infinity-stroke{stroke:#6d6963}
.date-imprint .infinity-loop:focus-visible{fill:rgba(140,130,96,.09)}

@media(prefers-reduced-motion:reduce){.day-word{transition:none}}
@media(prefers-reduced-motion:reduce){svg.cover .constellation,svg.cover .lettering{transition:none}}
.figure{cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
.figure .hit{fill:transparent;pointer-events:all;touch-action:manipulation}
.figure .moving{pointer-events:none;transform-box:view-box;transform-origin:var(--cx) var(--cy);transform:translate3d(0,0,0);transition:transform .38s cubic-bezier(.2,.7,.3,1)}
/* A close contact shadow plus a larger soft floating shadow. Only the pinned state reveals it. */
.figure .paper{fill:#fff;stroke:none;opacity:0;filter:drop-shadow(0 5px 8px rgba(52,40,23,.12)) drop-shadow(1px 14px 17px rgba(52,40,23,.085));transition:opacity .27s ease,filter .35s ease}
/* Watercolour, not a generic glowing oval: organic pale colour embedded behind the pen line. */
.figure .wash{opacity:0;pointer-events:none;filter:url(#wash-soft-edge);transition:opacity .48s cubic-bezier(.18,.61,.31,1)}
.figure:not(.pinned):hover .wash,.figure:not(.pinned):focus-visible .wash{opacity:.94}
.figure.pinned .wash{opacity:.73}
/* When hovered, ONLY the original drawing responds: no slip, no edge, no shadow. */
.figure:not(.pinned):hover .moving,.figure:not(.pinned):focus-visible .moving{transform:translate3d(0,-2.8px,0) rotate(var(--rot))}
.figure:not(.pinned):hover .paper,.figure:not(.pinned):focus-visible .paper{opacity:0}
/* A click lifts white paper out of a creamy wall; the ink stays intact on top. */
.figure.pinned .paper{opacity:1}
.figure.pinned .moving{animation:slip-float 5.9s ease-in-out infinite;animation-delay:var(--delay);transition:none}
.figure:focus-visible .drawing{filter:drop-shadow(0 0 1.3px rgba(56,49,31,.20))}
@keyframes slip-float{
0%,100%{transform:translate(0px,-1.2px) rotate(calc(var(--rot) * -.3))}
36%{transform:translate(1.3px,-5.1px) rotate(var(--rot))}
72%{transform:translate(-.9px,-2.9px) rotate(calc(var(--rot) * .24))}
}
@media(max-width:720px){
  main{min-height:100svh;padding:clamp(13px,3vh,27px) 7px 20px;place-items:start center;}
  /* Birthday text first; 16 individually positioned, larger icons underneath. */
  svg.cover{width:min(100%,460px);height:auto;max-width:100%;}
  svg.cover .constellation{transform:none}
  .date-imprint{transform:translateY(-5px)}
}
@media(prefers-reduced-motion:reduce){.figure .moving{animation:none!important;transition:none!important}}
@media(hover:none){.figure:not(.pinned):focus:not(:focus-visible) .wash{opacity:0}}
</style>

<script>
(()=>{
const items=[...document.querySelectorAll('.figure')];
const cover=document.querySelector('svg.cover');
const lettering=cover.querySelector('.lettering');
const constellation=cover.querySelector('.constellation');
const mobileQuery=window.matchMedia('(max-width:720px)');
// Fine-tuned for balance rather than scaling a desktop illustration down.
const mobileCenters={
 rod:[51,256],cone1:[142,262],lens:[227,252],cylinder:[316,263],
 edge:[49,362],disk:[141,359],sphere:[234,362],interval:[318,357],
 oval:[53,464],cone2:[147,459],s0:[231,465],openedge:[317,456],
 square:[51,568],infinity:[141,567],circle:[228,563],pointcircle:[316,567]
};
// Move the cone a little right and the infinity mark left so their papers don't meet.
const desktopOffset={}; // Use the artist's original placements, including deliberate overlaps.
function layout(){
 if(mobileQuery.matches){
   cover.setAttribute('viewBox','0 0 360 665');
   lettering.setAttribute('transform','translate(-20 -111) scale(1.26)');
   constellation.removeAttribute('transform');
   items.forEach(g=>{
     const c=mobileCenters[g.dataset.object];
     const cx=parseFloat(g.style.getPropertyValue('--cx'));
     const cy=parseFloat(g.style.getPropertyValue('--cy'));
     const scale=1.10;
     g.setAttribute('transform',`translate(${c[0]} ${c[1]}) scale(${scale}) translate(${-cx} ${-cy})`);
   });
 }else{
   cover.setAttribute('viewBox','14 8 584 340');
   lettering.removeAttribute('transform');
   constellation.removeAttribute('transform');
   items.forEach(g=>{
     const c=desktopOffset[g.dataset.object];
     if(c) g.setAttribute('transform',`translate(${c[0]} ${c[1]})`);
     else g.removeAttribute('transform');
   });
 }
}
mobileQuery.addEventListener?.('change',layout);
layout();
// Mathematics-based playful names. Correct object interpretations supplied by the artist.
const concepts={
 rod:{name:'Troubleday',homeo:'two-origins',themes:['glue','nonhausdorff']},
 cone1:{name:'Coneday',homeo:'disk',themes:['glue','compact','contractible']},
 lens:{name:'Suspensionday',homeo:'sphere2',sphereDim:2,themes:['glue','compact']},
 cylinder:{name:'Cylinderday',homeo:'cylinder',themes:['product','compact']},
 edge:{name:'Closedday',homeo:'closed-interval',themes:['interval','compact','contractible']},
 disk:{name:'Diskday',homeo:'disk',themes:['compact','contractible']},
 sphere:{name:'Sphereday',homeo:'sphere2',sphereDim:2,themes:['glue','compact']},
 interval:{name:'Halfopenday',homeo:'half-open',themes:['interval']},
 oval:{name:'Torusday',homeo:'torus',themes:['glue','compact','product']},
 cone2:{name:'Quotientday',homeo:'sphere2',sphereDim:2,themes:['glue','compact']},
 s0:{name:'Disconnectday',homeo:'sphere0',sphereDim:0,themes:['compact']},
 openedge:{name:'Openday',homeo:'open-interval',themes:['interval']},
 square:{name:'Squareday',homeo:'disk',themes:['compact','contractible','product']},
 infinity:{name:'Plusday',homeo:'sphere2',sphereDim:2,themes:['compact']},
 circle:{name:'Circleday',homeo:'sphere1',sphereDim:1,themes:['compact']},
 pointcircle:{name:'Circleday',homeo:'sphere1',sphereDim:1,themes:['glue','compact']}
};
const dayWord=document.querySelector('.day-word');
const live=document.getElementById('title-live');
// A directly depicted quotient construction is a little mathematical birth.
// Keyed as unordered pairs because visitors can select the figures in either order.
const birthdayPairs=[
 ['cylinder','cone1'],      // Collapse one boundary circle -> cone on S¹ ≅ D²
 ['cylinder','lens'],       // Collapse the two boundary circles separately -> ΣS¹ ≅ S²
 ['cylinder','oval'],       // Identify the two ends pointwise -> torus
 ['disk','cone2'],          // Collapse the disk boundary -> S²
 ['edge','pointcircle'],    // Identify the endpoints -> S¹
 ['edge','circle'],         // The same endpoint quotient, shown as a circle
 ['square','oval'],         // Identify opposite sides -> torus
];
const birthdayPairKeys=new Set(birthdayPairs.map(pair=>[...pair].sort().join('|')));
function sharedWord(ids){
 if(ids.length===items.length)return 'Topoday';
 if(ids.length===1)return concepts[ids[0]].name;
 const group=ids.map(id=>concepts[id]);
 if(ids.length===2 && birthdayPairKeys.has([...ids].sort().join('|')))return 'Birthday';
 if(group.every(x=>x.homeo===group[0].homeo))return 'Homeoday';
 if(group.every(x=>x.sphereDim!==undefined) && new Set(group.map(x=>x.sphereDim)).size>1)return 'S^nday';
 if(ids.every(id=>['edge','interval','openedge'].includes(id)))return 'Intervalday';
 if(ids.every(id=>['cone1','lens','sphere','cone2','oval','pointcircle','rod'].includes(id)))return 'Glueday';
 if(ids.every(id=>concepts[id].themes.includes('product')))return 'Productday';
 if(ids.every(id=>concepts[id].themes.includes('compact')))return 'Compactday';
 return 'Topoday';
}
function fitPrintedTitle(){
 // Set its actual font to the intended size, then use SVG text measurement to fit
 // the small printed word between handwritten 'Happy' and the first floating icon.
 dayWord.style.fontSize='28px';
 const w=dayWord.getComputedTextLength();
 const maxWidth=157;
 if(w>maxWidth){dayWord.style.fontSize=(28*maxWidth/w).toFixed(2)+'px'}
}
function updateBirthday(){
 const active=items.filter(g=>g.classList.contains('pinned')).map(g=>g.dataset.object);
 const word=active.length?sharedWord(active):'Birthday';
 dayWord.textContent=word+',';
 fitPrintedTitle();
 document.title='Happy '+word+', Bruno Munari!';
 live.textContent=document.title;
}
function toggle(g){const active=g.classList.toggle('pinned');g.setAttribute('aria-pressed',String(active));updateBirthday()}
function setSelection(ids){
 const chosen=new Set(ids);
 for(const g of items){
   const active=chosen.has(g.dataset.object);
   g.classList.toggle('pinned',active);
   g.setAttribute('aria-pressed',String(active));
 }
 updateBirthday();
}
function reset(){setSelection([])}
// Curated mathematically meaningful selections, rather than arbitrary subsets.
// Shuffle without repetition until all have appeared, then shuffle again.
const discoveries=[
 ['sphere','cone2','infinity'],                // Homeoday: S² in three models
 ['lens','sphere','infinity','cone2'],         // Homeoday: four S² models
 ['cone1','disk','square'],                   // Homeoday: closed disks
 ['circle','pointcircle'],                    // Homeoday: S¹ and its interval quotient
 ['s0','circle','sphere'],                    // S^nday: dimensions 0, 1, 2
 ['s0','pointcircle','lens'],                 // S^nday: 0, 1, 2 again
 ['cylinder','cone1'],                    // Birthday: collapse one end
 ['cylinder','lens'],                     // Birthday: collapse both ends separately
 ['cylinder','oval'],                     // Birthday: identify the cylinder ends
 ['disk','cone2'],                       // Birthday: collapse the disk boundary
 ['edge','pointcircle'],                 // Birthday: identify the interval ends
 ['square','oval'],                      // Birthday: identify opposite square sides
 ['edge','interval','openedge'],              // Intervalday
 ['cylinder','square','oval'],               // Productday
 ['rod','cone1','oval'],                     // Glueday: quotient/gluing presentations
 ['sphere','oval','pointcircle'],            // Glueday
 ['edge','disk','cylinder'],                 // Compactday
 ['s0','cylinder','square'],                 // Compactday
].filter(ids=>sharedWord(ids)!=='Topoday');
let discoveryBag=[];
function surprise(){
 if(!discoveryBag.length){
   discoveryBag=Array.from({length:discoveries.length},(_,i)=>i);
   for(let i=discoveryBag.length-1;i>0;i--){
     const j=Math.floor(Math.random()*(i+1));
     [discoveryBag[i],discoveryBag[j]]=[discoveryBag[j],discoveryBag[i]];
   }
 }
 setSelection(discoveries[discoveryBag.pop()]);
}
function invertSelection(){
 const selected=new Set(items.filter(g=>g.classList.contains('pinned')).map(g=>g.dataset.object));
 setSelection(items.map(g=>g.dataset.object).filter(id=>!selected.has(id)));
}
function bindInfinityLoop(id,action){
 const el=document.getElementById(id);
 el.addEventListener('click',event=>{event.stopPropagation();action()});
 el.addEventListener('keydown',event=>{
   if(event.key==='Enter'||event.key===' '){event.preventDefault();event.stopPropagation();action()}
 });
}
bindInfinityLoop('infinity-left',surprise);
bindInfinityLoop('infinity-right',invertSelection);
for(const g of items){
 g.addEventListener('click',event=>{event.stopPropagation();toggle(g)});
 g.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();toggle(g)}});
}
document.addEventListener('keydown',event=>{if(event.key==='Escape')reset()});
updateBirthday();
if(document.fonts && document.fonts.ready)document.fonts.ready.then(fitPrintedTitle);
window.__coverTest={objects:items.map(g=>g.dataset.object),active:()=>items.filter(g=>g.classList.contains('pinned')).map(g=>g.dataset.object),title:()=>dayWord.textContent||'Birthday,',layout:()=>cover.getAttribute('viewBox'),surprise,invertSelection,birthdayPairs,sharedWord,discoveries,setSelection};
})();
</script>
