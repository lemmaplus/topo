<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5ee">
<title>Pottery Lottery</title>
<style>
:root{
  --wall:#f7f5ee;
  --ink:#171717;
  --paper:#fffdfa;
  --warm:#c4b58a;
  --ginger:#b78632;
  --clay:#ac7936;
  --clay-deep:#93602e;
  --clay-ink:#9a6732;
  --peach:#f5b7bd;
  --peach-strong:#f19eaf;
  --celadon:#cee5bf;
  --butter:#f7e2ac;
  --ginger-deep:#9d6f23;
  --lav:#7f90c3;
  --lav-soft:#c7d0f3;
  --sand:#d8c08a;
  --sand-soft:#e6d7ad;
  --pink-soft:#efd0d7;
  --cherry:#d7728a;
  --blue-fill:#c7d0f3;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--wall)}
body{-webkit-font-smoothing:antialiased;color:var(--ink)}
.sheet{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:44px clamp(22px,6vw,90px) 112px}
.exhibit{width:100%;max-width:1200px}
.exhibit[hidden]{display:none!important}
.spaces{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:clamp(28px,5vw,92px)}
.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;gap:clamp(20px,3vw,44px)}
.space,.product-cell{min-width:0;display:flex;justify-content:center;align-items:center}
svg.instrument{display:block;width:100%;height:auto;aspect-ratio:480/385;overflow:visible;user-select:none;-webkit-user-select:none;touch-action:none}
svg.instrument.interval-instrument{aspect-ratio:480/385}
svg.product-svg{display:block;width:100%;height:auto;aspect-ratio:300/260;overflow:visible}
.basecircle{fill:none;stroke:var(--clay-ink);stroke-width:5.2;stroke-linecap:round}
.base-line{fill:none;stroke:var(--clay-ink);stroke-width:5.2;stroke-linecap:round}
#subspaceExhibit .basecircle{stroke:var(--clay-deep);stroke-width:5.8}
#quotientExhibit .basecircle,#quotientExhibit .base-line{stroke:var(--ink);stroke-width:5.6}
#prodTorusFactors .factor-circle{stroke:var(--clay);stroke-width:5.4}
.base-line{fill:none;stroke:var(--clay-ink);stroke-width:5.2;stroke-linecap:round}
.segment{fill:none;stroke:#b6a57f;stroke-width:10.5;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#quotSelected{stroke:#c4b58a;stroke-width:11.2}
#subPreSelected,#subTargetSelected{stroke:#baa474;stroke-width:11.2}
.open-blob-sand{fill:#d7deea;fill-opacity:.66;stroke:none;pointer-events:none}
.open-blob-pink{fill:#e6dcc5;fill-opacity:.84;stroke:none;pointer-events:none}
.open-blob-lav{fill:#dfe4ef;fill-opacity:.76;stroke:none;pointer-events:none}
.hit-disk{fill:transparent;stroke:none}
.seam-point{fill:var(--clay-deep);stroke:var(--wall);stroke-width:4.5;paint-order:stroke fill;pointer-events:none}
.open-end{fill:var(--wall);stroke:var(--peach-strong);stroke-width:2.7;pointer-events:none}
.annulus-body{fill:var(--clay);stroke:none;pointer-events:none}
.annulus-intersection-blue{fill:#cfd6e6;fill-opacity:.96;stroke:none;pointer-events:none}
.annulus-intersection-pink{fill:#cfbf97;fill-opacity:.96;stroke:none;pointer-events:none}
/* Product page */
.product-body{fill:var(--ginger);stroke:none}
.product-open{fill:var(--lav-soft);stroke:none}
.product-open-2{fill:var(--pink-soft);stroke:none}
.product-outline{fill:none;stroke:rgba(0,0,0,.10);stroke-width:1.2}
/* A pair of raspberry-like pagination berries, away from the artwork. */
.page-berries{position:fixed;left:clamp(14px,2.8vw,38px);bottom:calc(clamp(13px,2.6vh,27px) + env(safe-area-inset-bottom));z-index:35;display:flex;align-items:center;isolation:isolate}
.page-berry{appearance:none;width:39px;height:39px;border-radius:52% 48% 51% 49%;padding:0;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;transition:transform .18s ease,background .18s ease}
.page-berry.previous{background:#b78632;border:2px solid #b78632;color:#fff4d9;z-index:2}
.page-berry.following{background:var(--wall);border:2.5px solid #b78632;color:#9d6f23;margin-left:-5px;z-index:1}
.page-berry svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.page-berry:hover{transform:translateY(-2px)}
.page-berry:focus-visible{outline:2px solid #7c90ba;outline-offset:4px}

/* Only the two product-topology pages gain the space once taken by the pager. */
body.product-focus .sheet{padding:clamp(12px,2.2vh,28px) clamp(12px,2.6vw,42px) clamp(45px,5.8vh,65px)}
body.product-focus #prodSquareExhibit,body.product-focus #prodTorusExhibit{max-width:1600px}
body.product-focus #prodSquareExhibit .spaces,body.product-focus #prodTorusExhibit .torus-pair{gap:clamp(12px,2.8vw,52px)}
body.product-focus #prodTorusFactors{width:100%;transform:translateY(12px)}

@media (max-width:860px){
  .sheet{padding:18px 23px 101px}
  .spaces,.products,.torus-pair{grid-template-columns:1fr;gap:clamp(8px,2vh,24px)}
  svg.instrument{width:min(100%,390px);max-height:39svh}
  svg.instrument.interval-instrument{max-height:39svh;overflow:visible}
  svg.product-svg{width:min(100%,330px);max-height:31svh}
  .page-berry{width:35px;height:35px}
  body.product-focus .sheet{padding:12px clamp(8px,2.5vw,20px) calc(45px + env(safe-area-inset-bottom))}
  body.product-focus #prodSquareExhibit .spaces,body.product-focus #prodTorusExhibit .torus-pair{gap:clamp(4px,1.2vh,13px)}
  body.product-focus #prodSquareExhibit svg.instrument,body.product-focus #prodTorusExhibit svg.instrument{width:min(100%,480px);max-height:44svh}
  body.product-focus #prodTorusFactors{width:min(100%,480px);transform:none}
}
@media (prefers-reduced-motion:reduce){.exhibit{animation:none}.page-berry{transition:none}}

/* Product topology: projection pullbacks in lavender/pink, their meet in warm gold. */
.product-strip-u{fill:#bac9e8;fill-opacity:.50;pointer-events:none}
.product-strip-v{fill:#d9d9b3;fill-opacity:.46;pointer-events:none}
.product-rectangle{fill:#b58a3c;fill-opacity:.95;pointer-events:none}
.product-factor-u{stroke:#8296c1;stroke-width:10;stroke-linecap:round;fill:none;pointer-events:none}
.product-factor-v{stroke:#b8b57c;stroke-width:10;stroke-linecap:round;fill:none;pointer-events:none}
.product-geometry{fill:#b88637;stroke:none}
.product-highlight{fill:#d9dfef;stroke:none}
.product-boundary{fill:none;stroke:#986f35;stroke-width:2.5;pointer-events:none}
.torus-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:clamp(26px,4vw,46px)}
.factor-circle{fill:none;stroke:var(--ginger);stroke-width:5.1;stroke-linecap:round}
.factor-arc-u{fill:none;stroke:#8296c1;stroke-width:12.5;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.factor-arc-v{fill:none;stroke:#b8b57c;stroke-width:12.5;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.factor-dot{fill:var(--warm);stroke:var(--wall);stroke-width:3.6;paint-order:stroke fill;pointer-events:none}
.factor-hit{fill:transparent;stroke:none}
#intervalHighlights path{stroke:#8b9bc8;stroke-width:10.8;stroke-linecap:round;fill:none;pointer-events:none}
#intervalZero,#intervalOne,#quotCircle .seam-point{fill:var(--warm);stroke:var(--wall);stroke-width:4.5}
#annulusPre .annulus-body,#annulusAmbient .annulus-body{fill:var(--clay)}
.factor-handle-open{fill:var(--wall);stroke:var(--warm);stroke-width:3.2;pointer-events:none}
.factor-handle-solid{fill:var(--warm);stroke:var(--wall);stroke-width:3.2;paint-order:stroke fill;pointer-events:none}
.factor-handle-hit{fill:transparent;stroke:none;cursor:grab}

.torus-contour{fill:none;stroke:var(--ink);stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.torus-contour-soft{fill:none;stroke:rgba(23,23,23,.46);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.torus-seam{fill:none;stroke:rgba(23,23,23,.78);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.torus-sketched{fill:none;stroke:rgba(23,23,23,.92);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.torus-sketched-soft{fill:none;stroke:rgba(23,23,23,.56);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.glued-edge-x,.glued-edge-y{fill:none;stroke-width:4.2;stroke-linecap:round;pointer-events:none;opacity:.58}
.glued-edge-x{stroke:#8f7b56}.glued-edge-y{stroke:#b8b57c}


/* Two ginger berries: one keeps a basis element, the other assembles unions. */
.berry-rail{position:fixed;z-index:25;top:clamp(18px,4.3vh,42px);right:clamp(21px,4.7vw,75px);display:flex;align-items:center;gap:16px;pointer-events:none}
.berries{display:flex;align-items:center;isolation:isolate;pointer-events:auto}
.berry{width:43px;height:43px;cursor:pointer;padding:0;display:grid;place-items:center;border-radius:50%;appearance:none;transition:transform .2s ease,filter .2s ease,border-color .2s ease}
.berry:hover{transform:none}
.berry:focus-visible,.shape-pick:focus-visible,.specimen:focus-visible{outline:2px solid #7c90ba;outline-offset:4px}
#keepBerry{background:#b78632;border:2.5px solid #b78632;z-index:2}
#unionBerry{background:var(--wall);border:3px solid #b78632;margin-left:-11px;z-index:1}
.berry.select{filter:none}
#keepBerry.select{box-shadow:none}
#unionBerry.select{box-shadow:none;background:#f3dfad}
/* Subspace shape selection is independent of product union control. */
.shape-picker{display:none;position:fixed;z-index:25;top:clamp(18px,4.3vh,42px);right:clamp(21px,4.7vw,75px);align-items:center;gap:4px;pointer-events:auto}
.shape-picker.visible{display:flex}
.shape-pick{display:grid;place-items:center;border:0;background:none;padding:4px;width:37px;height:37px;cursor:pointer;opacity:.45;border-radius:50%;transition:opacity .2s,transform .2s}
.shape-pick.active{opacity:1;transform:scale(1.14)}
.shape-pick svg{width:30px;height:30px;overflow:visible}
.berry-rail[hidden]{display:none}
.specimen-rack{position:fixed;z-index:20;bottom:112px;left:50%;transform:translateX(-50%);width:min(76vw,730px);min-height:54px;display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap;pointer-events:none}
.specimen-rack:empty{display:none}
.specimen{pointer-events:auto;appearance:none;cursor:grab;position:relative;border:0;padding:2px;background:transparent;display:grid;place-items:center;width:49px;height:49px;flex:0 0 49px;touch-action:none;transition:transform .2s,filter .2s;animation:none}
.specimen svg{width:45px;height:45px;overflow:visible;pointer-events:none}
.specimen::after{content:none}
.specimen:hover{transform:none}
.specimen:active{cursor:grabbing}
.specimen-drag{position:fixed;z-index:80;width:52px;height:52px;pointer-events:none;opacity:.82;filter:drop-shadow(0 7px 6px rgba(79,63,30,.13))}
.specimen-drag svg{width:100%;height:100%}

body.assembly #prodTorusStripsU,body.assembly #prodTorusStripsV,
body.assembly #prodSquareStripsU,body.assembly #prodSquareStripsV,
body.assembly #prodCylinderStripsU,body.assembly #prodCylinderStripsV{opacity:.25}
body.assembly #prodTorusRectangles,body.assembly #prodSquareRectangles,body.assembly #prodCylinderRectangles{opacity:.17}
body.assembly #subPreSelected,body.assembly #annulusPreIntersection{opacity:.12}
.union-patch{fill:#9b9c73;opacity:.86;pointer-events:none}
.union-arc{stroke:#d9e8b7;stroke-width:11.8;stroke-linecap:round;fill:none;pointer-events:none}
.union-open{opacity:.94;stroke:none;pointer-events:none}
#prodTorusUnion,#prodSquareUnion,#prodCylinderUnion{pointer-events:none}
.union-glyph{display:none}
@media(max-width:860px){.torus-pair{grid-template-columns:1fr;gap:10px}.torus-pair .instrument{width:min(100%,310px);max-height:32svh}.berry-rail,.shape-picker{top:12px;right:14px;gap:8px}.berry{width:35px;height:35px}.shape-pick{width:27px;height:30px;padding:2px}.shape-pick svg{width:24px;height:24px}.specimen-rack{bottom:106px;width:calc(100% - 22px);gap:4px;min-height:37px}.specimen{width:37px;height:37px;flex-basis:37px}.specimen svg{width:35px;height:35px}}
#quotientExhibit .seam-point{fill:#526775;stroke:none}
#prodTorusExhibit{--seam-x:#526775;--seam-y:#93602e}
#prodTorusExhibit .glued-edge-x{stroke:var(--seam-x);opacity:1}
#prodTorusExhibit .glued-edge-y{stroke:var(--seam-y);opacity:1}
#prodTorusExhibit .factor-glue-x{fill:var(--seam-x);stroke:none}
#prodTorusExhibit .factor-glue-y{fill:var(--seam-y);stroke:none}
body.assembly #torusClayBase{fill:#ac7936;opacity:1}
body.assembly #prodTorusStripsU,body.assembly #prodTorusStripsV,body.assembly #prodTorusRectangles{display:none}
#specimenRack{position:fixed;inset:0;width:auto;height:auto;min-height:0;transform:none;display:block;pointer-events:none}
.paper-open-set{position:absolute;padding:0;border:0;background:none;pointer-events:none;touch-action:none}
.paper-open-set svg{display:block;overflow:visible;pointer-events:none}
.paper-open-set rect{pointer-events:visiblePainted;cursor:grab;touch-action:none}
.paper-open-set rect:active{cursor:grabbing}
#prodTorusExhibit .instrument{aspect-ratio:380/320}
@media(max-width:860px){#prodTorusExhibit .instrument{width:min(100%,390px);max-height:38svh}}

/* Unified fired-clay studies: pages 2–4. Strokes are screen-space widths. */
#quotientExhibit,#prodSquareExhibit,#prodTorusExhibit{--fired-clay:#c67942;--slip:#fff0d2;--charcoal:#292622;--seam-x:#292622;--seam-y:#813e2e}
#quotientExhibit .base-line,#quotientExhibit .basecircle,#prodTorusFactors .factor-circle,.atelier-bar{stroke:var(--fired-clay);stroke-width:4;stroke-linecap:butt;vector-effect:non-scaling-stroke}
.atelier-boundary,#prodTorusExhibit .glued-edge-x,#prodTorusExhibit .glued-edge-y{stroke-width:4;stroke-linecap:butt;stroke-linejoin:miter;vector-effect:non-scaling-stroke;opacity:1}
.atelier-boundary{stroke:var(--charcoal);fill:none}
.atelier-base,body.assembly #torusClayBase{fill:var(--fired-clay);opacity:1}
#quotSelected,#intervalHighlights line,#prodSquareFactorU line,#prodSquareFactorV line,#prodTorusFactorU line,#prodTorusFactorV line,#prodTorusFactors .factor-arc-u,#prodTorusFactors .factor-arc-v{stroke:var(--slip);stroke-width:8;stroke-linecap:butt;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#quotientExhibit .seam-point{fill:var(--charcoal);stroke:none}

@media(min-width:861px){
  #prodTorusFactors{width:88%;transform:translateY(28px)}
}
.placed-paper,.placed-paper rect{pointer-events:visiblePainted;cursor:grab;touch-action:none}
/* First sheet / Greek pottery: the saffron cut U ∩ A is upstairs only;
   the complete Aegean-green ambient open U stays downstairs. */
#annulusExhibit{--stamp-bg:#FBF7F0;--stamp-sand:#E8DED0;--stamp-dust:#D9CABA;--stamp-sage:#BFC3AF;--stamp-adobe:#C98E78;--stamp-clay:#A96F5A;--stamp-coral:#D49A86;--stamp-mauve:#B89A93;--stamp-turq:#7E9F9A}
#annulusExhibit .annulus-body{fill:var(--stamp-dust)}
#annulusExhibit .open-blob-pink{fill:#6F554B;fill-opacity:.94}
#annulusExhibit .annulus-intersection-blue,
#annulusExhibit .annulus-intersection-pink{fill:#EFE4D6;fill-opacity:1}
#annulusExhibit .saved-stamp-ambient{mix-blend-mode:multiply;fill-opacity:.24}
#annulusExhibit .saved-stamp-cut{mix-blend-mode:multiply;fill-opacity:.9}

#prodSquareExhibit{--utah-board:#A77967;--utah-h:#D79B7D;--utah-h-soft:#EFCBB9;--utah-v:#B7A7C9;--utah-v-soft:#DDD0E7;--utah-rect:#F7EAD8}
#prodSquareExhibit .atelier-base{fill:var(--utah-board)!important}
#prodSquareExhibit .atelier-bar{stroke:var(--utah-board)!important}

/* The atlas catch-all drag rectangle must NEVER sit above an already placed
   basic open. Its canvas still receives pointer events via the painted square. */
#prodSquareDragArea,#prodTorusDragArea{pointer-events:none}
/* Each rect of a saved open stays pickable (including seam-wrapped pieces). */
#prodSquareUnion .placed-paper rect,#prodTorusUnion .placed-paper rect{
  pointer-events:visiblePainted;cursor:grab;touch-action:none;
}
#prodSquareUnion .placed-paper rect:active,#prodTorusUnion .placed-paper rect:active{cursor:grabbing}
/* Union is a secondary view: it never obscures the current basis, or
   overrides pointer events. Saved pieces remain individually pickable. */
body.assembly #prodSquareUnion,body.assembly #prodTorusUnion{filter:saturate(1.12)}
/* Distinct gluing pairs on the fourth page. */
#prodTorusExhibit{--seam-x:#EC871B;--seam-y:#f2ce78}
/* In the monochrome cut study, keep only the gluing cues in colour: 
   papaya for one seam-pair, butter-gold for the other. */
#prodTorusExhibit .glued-edge-x{stroke:var(--seam-x)!important}
#prodTorusExhibit .glued-edge-y{stroke:var(--seam-y)!important}
#prodTorusExhibit .factor-glue-x{fill:var(--seam-x)!important;stroke:none!important}
#prodTorusExhibit .factor-glue-y{fill:var(--seam-y)!important;stroke:none!important}
#prodTorusExhibit .torus-seam-x{stroke:var(--seam-x)!important}
#prodTorusExhibit .torus-seam-y{stroke:var(--seam-y)!important}
/* The hollow berry on the fourth page starts a real hand-assembly mode:
   the live helper graphics withdraw, the two parallel guide bars vanish,
   and the left square becomes a dark clay workbench for the saved pieces. */
#prodTorusExhibit #torusClayBase{transition:fill .32s ease}
body.assembly #prodTorusExhibit #torusClayBase{fill:var(--chosen-clay,#513943);opacity:1}
body.assembly #prodTorusExhibit #prodTorusStripsU,
body.assembly #prodTorusExhibit #prodTorusStripsV,
body.assembly #prodTorusExhibit #prodTorusRectangles,
body.assembly #prodTorusExhibit #prodTorusFactorU,
body.assembly #prodTorusExhibit #prodTorusFactorV,
body.assembly #prodTorusExhibit .atelier-bar,
body.assembly #prodTorusExhibit #torusFactorArcsU,
body.assembly #prodTorusExhibit #torusFactorArcsV,
body.assembly #prodTorusExhibit #torusFactorHandlesU,
body.assembly #prodTorusExhibit #torusFactorHandlesV{display:none}
@media(prefers-reduced-motion:reduce){#prodTorusExhibit #torusClayBase{transition:none}}

/* Basis/clay mode distinctions for the product pages. */
#keepBerry[aria-disabled="true"]{opacity:.32!important;pointer-events:none;filter:saturate(.2)}
.memory-trace{fill:none;stroke:#fff0d2;stroke-opacity:.16;stroke-width:3;vector-effect:non-scaling-stroke;pointer-events:none}
.memory-trace.soft{stroke-opacity:.09}
.helper-faint{opacity:.22}

/* Final viewport-specific sizing for the two mathematical instruments only. */
@media(max-width:860px){
  body.product-focus #prodTorusExhibit .instrument,body.product-focus #prodTorusExhibit #prodTorusFactors,
  body.product-focus #prodSquareExhibit .instrument{width:min(100%,480px);max-height:44svh}
  body.product-focus #prodTorusFactors{transform:none}
}
@media(min-width:861px){body.product-focus #prodTorusFactors{width:100%;transform:translateY(12px)}}

/* Emakimono: four real mathematical stories mounted side by side.
   Geometry/pointer coordinates remain native SVG units. */
html,body{overflow-x:hidden}
.sheet{width:100%;height:100svh;min-height:0;overflow:hidden;display:flex;align-items:flex-start;justify-content:flex-start;padding:clamp(12px,2vh,24px) 0 0!important}
.story-track{display:flex;align-items:flex-start;gap:clamp(12px,1.2vw,18px);width:max-content;height:100%;padding:clamp(8px,1.5vh,18px) clamp(12px,1.8vw,24px) 0;transform:translate3d(0,0,0);transition:transform 430ms cubic-bezier(.24,.68,.34,1);will-change:transform;backface-visibility:hidden}
.story-panel{position:relative;flex:0 0 min(88vw,1280px);width:min(88vw,1280px);min-height:clamp(610px,82svh,860px);height:auto;display:flex;flex-direction:column;justify-content:center;background:#d7c6b8;border-radius:2px;padding:clamp(16px,1.8vw,24px) clamp(16px,1.9vw,26px) 12px;box-shadow:none;overflow:visible;scrollbar-width:none}
.story-panel::-webkit-scrollbar{display:none}
.story-panel .exhibit{width:100%;max-width:none}
.story-panel .spaces,.story-panel .torus-pair{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:stretch;gap:clamp(16px,1.7vw,28px);padding-bottom:12px;flex:1 1 auto}
.story-panel .space{min-width:0;display:flex;align-items:center;justify-content:center;padding:clamp(10px,1.15vw,14px);min-height:clamp(260px,34vw,455px)}
.story-panel[data-story="0"] .space:first-child{background:#8f5e53}.story-panel[data-story="0"] .space:last-child{background:#e8d8b5}
.story-panel[data-story="1"] .space:first-child{background:#a46f59}.story-panel[data-story="1"] .space:last-child{background:#eadbb8}
.story-panel[data-story="2"] .space:first-child{background:#88554c}.story-panel[data-story="2"] .space:last-child{background:#9a654e}
.story-panel[data-story="3"] .space:first-child{background:#5d4350}.story-panel[data-story="3"] .space:last-child{background:#734f46}
.story-panel svg.instrument{width:100%;height:auto;max-height:min(56svh,520px)}
.story-panel #annulusExhibit svg.instrument{aspect-ratio:390 / 350}
.story-panel #prodSquareExhibit svg.instrument{aspect-ratio:376 / 350}
.story-panel #prodTorusAtlas{aspect-ratio:372 / 320}
.story-panel #prodTorusFactors{aspect-ratio:370 / 320;width:100%;transform:none}

/* Story I: the ambient open U can extend mathematically beyond the display,
   but its paint and pointer hit area are clipped by the beige window. */
.story-panel[data-story="0"] .spaces > .space:last-child{overflow:hidden}

/* Keep the moving, clipped paper in its own paint boundary.
   The SVG clip path above remains authoritative for the open U geometry. */
.story-panel[data-story="0"] .spaces > .space:last-child{
  overflow:hidden;
  isolation:isolate;
  contain:paint;
}

/* Fourth story monochrome CUT mode.  Crucial: never apply grayscale to the
   entire SVG — that also desaturates the separately coloured gluing cues.
   Desaturate only the selected mathematical shapes and guides, leaving
   the two seam pairs and corresponding dots in their original colours. */
body:not(.assembly) .story-panel[data-story="3"] #prodTorusExhibit svg.instrument{
  filter:none;
}
body:not(.assembly) #prodTorusExhibit #torusClayBase{
  fill:#B7ACB9 !important;
  opacity:1;
}
body:not(.assembly) #prodTorusExhibit .atelier-bar,
body:not(.assembly) #prodTorusExhibit .factor-circle{
  stroke:#7D7383 !important;
}
body:not(.assembly) #prodTorusExhibit #prodTorusStripsU,
body:not(.assembly) #prodTorusExhibit #prodTorusStripsV,
body:not(.assembly) #prodTorusExhibit #prodTorusRectangles,
body:not(.assembly) #prodTorusExhibit #prodTorusUnion,
body:not(.assembly) #prodTorusExhibit #prodTorusFactorU,
body:not(.assembly) #prodTorusExhibit #prodTorusFactorV,
body:not(.assembly) #prodTorusExhibit #torusFactorArcsU,
body:not(.assembly) #prodTorusExhibit #torusFactorArcsV,
body:not(.assembly) #prodTorusExhibit #torusFactorHandlesU,
body:not(.assembly) #prodTorusExhibit #torusFactorHandlesV{
  filter:grayscale(1);
}
/* Refine the fourth cut study: lighten the two factor circles on the right,
   and let the left square show only the open set itself (no full crossing strips). */
body:not(.assembly) #prodTorusExhibit #prodTorusFactors .factor-circle{
  stroke:#C5B8AE !important;
}
body:not(.assembly) #prodTorusExhibit #torusFactorArcsU,
body:not(.assembly) #prodTorusExhibit #torusFactorArcsV,
body:not(.assembly) #prodTorusExhibit #torusFactorHandlesU,
body:not(.assembly) #prodTorusExhibit #torusFactorHandlesV{
  filter:grayscale(1) brightness(1.18);
}
/* Only the auxiliary bars are grey: the four square gluing edges
   retain the two paired colours defined above. */
body:not(.assembly) #prodTorusExhibit #prodTorusAtlas .atelier-bar{
  stroke:#5d5d5d !important;
}
body:not(.assembly) #prodTorusExhibit #prodTorusAtlas .glued-edge-x{
  stroke:var(--seam-x) !important;
}
body:not(.assembly) #prodTorusExhibit #prodTorusAtlas .glued-edge-y{
  stroke:var(--seam-y) !important;
}
body:not(.assembly) #prodTorusExhibit #prodTorusStripsU,
body:not(.assembly) #prodTorusExhibit #prodTorusStripsV{
  display:none;
}

/* FOURTH STORY: monochrome mathematics in BOTH Cut and Clay modes.
   These styles apply only inside the torus instrument, NOT to the coloured
   cut-out papers in #prodTorusUnion or the floating specimen rack. */
#prodTorusExhibit{
  --seam-x:#7E8794; /* Utah canyon dusk: slate shadow / vertical gluing pair and first factor point */
  --seam-y:#D8B06A; /* Utah canyon dusk: sunset ochre / horizontal gluing pair and second factor point */
}
#prodTorusExhibit #prodTorusAtlas .glued-edge-x,
#prodTorusExhibit #prodTorusAtlas .glued-edge-y{
  stroke-width:4;
}
#prodTorusExhibit #prodTorusFactors .factor-circle{
  stroke:#C5B8AE !important;
}
#prodTorusExhibit #torusFactorArcsU,
#prodTorusExhibit #torusFactorArcsV,
#prodTorusExhibit #torusFactorHandlesU,
#prodTorusExhibit #torusFactorHandlesV{
  filter:grayscale(1) brightness(1.18);
}
#prodTorusExhibit #prodTorusAtlas .atelier-bar{stroke:#8A7A82 !important}
body:not(.assembly) #prodTorusExhibit #prodTorusAtlas #prodTorusRectangles rect{
  fill:#FBF0EA;
}
body.assembly #prodTorusExhibit #torusClayBase{
  fill:var(--chosen-clay,#7A6675) !important;
  opacity:1;
}
/* Keep the saved ceramic-paper palette exactly as it was, even in Clay. */
body.assembly #prodTorusExhibit #prodTorusUnion{filter:none}

/* Fourth gadget: saved basis elements are glued to their original positions.
   Cut is a monochrome recording surface with soft gray impressions;
   Clay reveals every recorded basis in its original opaque pastel color. */
#prodTorusExhibit #prodTorusMemories,
#prodTorusExhibit #prodTorusUnion,
#prodTorusExhibit #prodTorusUnion *{
  pointer-events:none!important;
}
body:not(.assembly) #prodTorusExhibit #prodTorusUnion{
  filter:none!important;
}
#prodTorusExhibit #prodTorusMemories rect{
  pointer-events:none;
  fill:#EADBCF;
  fill-opacity:.20;
  stroke:#F7EEE8;
  stroke-opacity:.45;
  stroke-width:3;
  vector-effect:non-scaling-stroke;
}
body.assembly #prodTorusExhibit #prodTorusMemories{display:none}
/* Fourth gadget refinement: remove the horizontal/vertical guide bars
   (and their selected bar-segments) and make the four gluing boundaries thicker. */
#prodTorusExhibit #prodTorusAtlas .atelier-bar,
#prodTorusExhibit #prodTorusFactorU,
#prodTorusExhibit #prodTorusFactorV{
  display:none !important;
}
#prodTorusExhibit #prodTorusAtlas .glued-edge-x,
#prodTorusExhibit #prodTorusAtlas .glued-edge-y{
  stroke-width:6.8 !important;
}
body.assembly #prodTorusExhibit #prodTorusAtlas .glued-edge-x,
body.assembly #prodTorusExhibit #prodTorusAtlas .glued-edge-y{
  display:none !important;
}
.story-panel[data-story="3"] #prodTorusAtlas{

}

/* Keep the interlude tied to the physical phone, not media-query pointer type:
   Safari and embedded iOS previews can report hover/pointer capabilities differently.
   In particular, a resized iPad window must retain the mathematical workbench. */
(function(){
  function updatePhoneLandscape(){
    const ua=navigator.userAgent||'';
    const shortSide=Math.min(screen.width||Infinity,screen.height||Infinity);
    const isPhone=/iPhone|iPod/i.test(ua) ||
      (shortSide<=600 && (navigator.maxTouchPoints>0 || matchMedia('(pointer:coarse)').matches));
    const viewportLandscape=innerWidth>innerHeight*1.08;
    const orientationLandscape=(typeof window.orientation==='number' && Math.abs(window.orientation)===90) ||
      (screen.orientation && /^landscape/.test(screen.orientation.type));
    document.documentElement.classList.toggle('phone-landscape-interlude',
      !!(isPhone && (viewportLandscape || orientationLandscape)));
  }
  updatePhoneLandscape();
  addEventListener('resize',updatePhoneLandscape,{passive:true});
  addEventListener('orientationchange',updatePhoneLandscape,{passive:true});
  if(window.visualViewport)window.visualViewport.addEventListener('resize',updatePhoneLandscape,{passive:true});
})();

<script>
(()=>{
'use strict';
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const PI=Math.PI, TAU=2*PI;
const S={x:240,y:183,r:151};
let page=2;
const visiblePages=[2,1,4,6];
const storyTrack=$('storyTrack');
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
const sheet=document.querySelector('.sheet');
const storyPanels=[...storyTrack.querySelectorAll('.story-panel')];
const panelPageMap={0:2,1:1,2:4,3:6};
let scrollOffsetPx=0;
let slideFallback=null;
let backgroundDrag=null;
let activeStoryId=0;
// Independent studios retain their open sets and selected mode while the visitor turns pages.
const savedStoryUnionMode={4:false,6:false};
const panelGap=()=>parseFloat(getComputedStyle(storyTrack).columnGap)||0;
function panelSpan(p){return p.getBoundingClientRect().width+panelGap();}
function setScrollOffset(immediate=false){
  if(immediate||reducedMotion.matches){
    const prev=storyTrack.style.transition;
    storyTrack.style.transition='none';
    storyTrack.style.transform=`translate3d(${-scrollOffsetPx}px,0,0)`;
    void storyTrack.offsetWidth;
    storyTrack.style.transition=prev;
  }else{
    storyTrack.style.transform=`translate3d(${-scrollOffsetPx}px,0,0)`;
  }
}
// These DOM rotations preserve the exact on-screen coordinates of all
// existing mathematical instruments. No SVG is cloned and no ID duplicated.
function moveFirstToEnd(){
  const p=storyTrack.firstElementChild;
  const span=panelSpan(p);
  storyTrack.append(p);
  scrollOffsetPx-=span;
  setScrollOffset(true);
}
function moveLastToFront(){
  const p=storyTrack.lastElementChild;
  const span=panelSpan(p);
  storyTrack.prepend(p);
  scrollOffsetPx+=span;
  setScrollOffset(true);
}
function keepLoopFilled(){
  // Rotate only an off-screen panel, maintaining the cylindrical illusion.
  for(let i=0;i<storyPanels.length+2;i++){
    const first=storyTrack.firstElementChild;
    if(first.getBoundingClientRect().right<0){moveFirstToEnd();continue;}
    // A narrow page centered on a wide tablet naturally leaves a side gutter.
    // That gutter is not a request to rotate the infinite picture scroll.
    // Allow the centered margin (plus a small tolerance) before wrapping.
    const centeredGutter=Math.max(0,(window.innerWidth-first.getBoundingClientRect().width)/2);

}

}
function animateToPanel(p,immediate=false){

    storyTrack.classList.add('is-moving');

function flip(direction){

  let neighbor=direction>0?current.nextElementSibling:current.previousElementSibling;

});

// The emaki and the mathematical workbenches have separate spatial domains.
// When the pointer is over either coloured window, ALL wheel gestures stay

// SVGs remain sovereign even if part of their drawing extends into the trim.
// The 8.5% inset is the same as --math-window-trim in the desktop CSS below.
const desktopScrollWheel=window.matchMedia('(min-width:861px) and (hover:hover) and (pointer:fine)');
const desktopMathWindowTrim=.085;
function pointerOverMathWindow(x,y){
  for(const board of storyTrack.querySelectorAll('.story-panel .space')){
    const r=board.getBoundingClientRect();
    const pad=r.height*desktopMathWindowTrim;
    if(x>=r.left && x<=r.right && y>=r.top+pad && y<=r.bottom-pad) return true;
  }

}

  if(!desktopScrollWheel.matches||e.ctrlKey||e.metaKey||e.altKey||backgroundDrag)return;

  if(pointerOverMathWindow(e.clientX,e.clientY))return;

// Desktop retains its picture-scroll drag; mobile's board is fixed.

  // The newly revealed beige margins are part of the paper scroll, not the math.
  if(desktopScrollWheel.matches){
    if(pointerOverMathWindow(e.clientX,e.clientY))return;
  }else if(e.target.closest('.space'))return;

});
sheet.addEventListener('pointermove',e=>{

});
function endBackgroundDrag(e){
  if(!backgroundDrag||e.pointerId!==backgroundDrag.id)return;

  backgroundDrag=null;
  sheet.classList.remove('is-hand-dragging');
  storyTrack.style.transition='';
  keepLoopFilled();

    animateToPanel(centeredPanel());

sheet.addEventListener('pointerup',endBackgroundDrag);
sheet.addEventListener('pointercancel',endBackgroundDrag);
sheet.addEventListener('lostpointercapture',endBackgroundDrag);
window.addEventListener('resize',()=>{
  stopAnimation();
  const intended=storyPanels.find(p=>+p.dataset.story===activeStoryId);
  if(intended)animateToPanel(intended,true);
});
function point(event, svg){const pt=svg.createSVGPoint();pt.x=event.clientX;pt.y=event.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse());}
function clamp(x,a,b){return Math.min(b,Math.max(a,x));}
function setAttrs(el,obj){for(const[k,v] of Object.entries(obj))el.setAttribute(k,v)}
function svgElement(name,attrs){const el=document.createElementNS(NS,name);setAttrs(el,attrs);return el;}

}

// Geometric clay dies inspired by the forms of Southwest ceramics,
// not copies of particular community-specific or ceremonial designs.
const potteryPolygons={
  diamond:[[[0,-.91],[.84,0],[0,.91],[-.84,0]]],
  mesa:[[
    [-.30,-.85],[.30,-.85],[.30,-.52],[.54,-.52],
    [.54,-.20],[.88,-.20],[.88,.72],[-.88,.72],
    [-.88,-.20],[-.54,-.20],[-.54,-.52],[-.30,-.52]
  ]],
  zigzag:[
    [[-.90,-.72],[-.45,-.40],[0,-.72],[.45,-.40],[.90,-.72],
     [.90,-.43],[.45,-.11],[0,-.43],[-.45,-.11],[-.90,-.43]],
    [[-.90,.13],[-.45,.45],[0,.13],[.45,.45],[.90,.13],

};
function stampPolygonPath(b,polygon){

  ).join(' ')+' Z ';
}

         + ellipse(b.x,b.y-b.r*.24,b.r*.22*b.sx,b.r*.36*b.sy,0)
         + ellipse(b.x+b.r*.48*b.sx,b.y-b.r*.1,b.r*.22*b.sx,b.r*.33*b.sy,0);
  }
  if(b.kind==='spiral'){
    return ellipse(b.x-b.r*.12*b.sx,b.y-b.r*.02,b.r*.70*b.sx,b.r*.60*b.sy,.2)
         + ellipse(b.x+b.r*.16*b.sx,b.y+b.r*.02,b.r*.40*b.sx,b.r*.36*b.sy,.55)
         + ellipse(b.x+b.r*.32*b.sx,b.y+b.r*.08,b.r*.18*b.sx,b.r*.16*b.sy,.75);

function stampLocalPoint(b,p){

}
function insideShape(b,p){

    const x=(p.x-cx)/rx,y=(p.y-cy)/ry,theta=Math.atan2(y,x);
    const w=1+.029*Math.sin(3*theta+phase)+.022*Math.cos(5*theta-phase);

      || ell(b.x,b.y-b.r*.24,b.r*.22*b.sx,b.r*.36*b.sy,0)
      || ell(b.x+b.r*.48*b.sx,b.y-b.r*.1,b.r*.22*b.sx,b.r*.33*b.sy,0);

    return ell(b.x-b.r*.12*b.sx,b.y-b.r*.02,b.r*.70*b.sx,b.r*.60*b.sy,.2)
      || ell(b.x+b.r*.16*b.sx,b.y+b.r*.02,b.r*.40*b.sx,b.r*.36*b.sy,.55)
      || ell(b.x+b.r*.32*b.sx,b.y+b.r*.08,b.r*.18*b.sx,b.r*.16*b.sy,.75);

      || ell(b.x+b.r*.66*b.sx,b.y-b.r*.13,b.r*.52*b.sx,b.r*.48*b.sy,1.1);

function boardGeometry(item){

function boardScreenRect(item){

    .map(([x,y])=>({x:m.a*x+m.c*y+m.e,y:m.b*x+m.d*y+m.f}));
  return {left:Math.min(...corners.map(p=>p.x)),right:Math.max(...corners.map(p=>p.x)),
    top:Math.min(...corners.map(p=>p.y)),bottom:Math.max(...corners.map(p=>p.y))};

function attachPlacedDrag(group,item,target){
  group.classList.add('placed-paper');
  let drag=null;
  group.addEventListener('pointerdown',e=>{
    if(!unionMode)return;
    if(e.pointerType==='mouse'&&e.button!==0)return;
    const m=target.getScreenCTM(),scale=Math.hypot(m.a,m.b)||1;
    drag={pointerId:e.pointerId,x:e.clientX,y:e.clientY,scale};
    group.setPointerCapture(e.pointerId);
    e.stopPropagation();e.preventDefault();
  });
  group.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.pointerId)return;
    e.stopPropagation();
    // The paper can be peeled off, but it cannot be moved to a false
    // product-coordinate position while it is attached to the clay.
    if(boardContainsPoint(item,e))group.removeAttribute('transform');
    else group.setAttribute('transform',`translate(${(e.clientX-drag.x)/drag.scale} ${(e.clientY-drag.y)/drag.scale})`);
  });
  group.addEventListener('pointerup',e=>{
    if(!drag||e.pointerId!==drag.pointerId)return;
    e.stopPropagation();e.preventDefault();
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    drag=null;group.removeAttribute('transform');
    if(Math.hypot(dx,dy)<=5 || boardContainsPoint(item,e)){

      item.boardDX=0;item.boardDY=0;
      return;
    }
    const b=boardGeometry(item),shape=cutoutGeometry(item),m=target.getScreenCTM();
    const ax=b.x+shape.x,ay=b.y+shape.y;
    item.paperX=m.a*ax+m.c*ay+m.e+dx;
    item.paperY=m.b*ax+m.d*ay+m.f+dy;
    item.paperScale=Math.hypot(m.a,m.b);
    const pw=shape.w*item.paperScale,ph=shape.h*item.paperScale;
    item.paperX=clamp(item.paperX,8,Math.max(8,innerWidth-pw-8));
    item.paperY=clamp(item.paperY,8,Math.max(8,innerHeight-ph-10));

}
function cutoutGeometry(item){

    for(const [c,d] of productIntervals(item.value.t,item.value.rt,q.cyclicT))

function renderProductAtlas(name){

  const u=$('prod'+name+'StripsU'),v=$('prod'+name+'StripsV'),rr=$('prod'+name+'Rectangles');

      stroke:uStroke,'stroke-opacity':lineOpacity,'stroke-width':10,

      stroke:vStroke,'stroke-opacity':lineOpacity,'stroke-width':10,
      'stroke-linecap':'round','pointer-events':'none'}));
    vf.append(svgElement('line',{x1:79,y1:AY(c),x2:79,y2:AY(d),
      stroke:'transparent','stroke-width':22,'pointer-events':'stroke',
      'data-product-role':'move','data-axis':'t',style:'cursor:grab;touch-action:none'}));
  }

  // Always insert endpoint hits last so they win over the segment hit areas.

    ['t',vf,o.cyclicT,79,'vertical',o.t,o.rt]]){

}
function cylinderPoint(s,t){
  const a=2*Math.PI*s,front=Math.cos(a),height=200;
  return [240+120*Math.sin(a), 81+(1-t)*height+28*front,front];
}
function torusPoint(s,t){
  const a=2*Math.PI*s,b=2*Math.PI*t,R=106,r=44;
  const x=(R+r*Math.cos(b))*Math.cos(a), y=(R+r*Math.cos(b))*Math.sin(a),z=r*Math.sin(b);
  // oblique orthographic projection and painter depth
  return [240+x*.97,192-y*.43-z*.88, y*.89-z*.25];
}
function renderSurface(name,o,g){
  const cyl=name==='Cylinder',ns=cyl?90:96,nt=cyl?32:44;
  const point=cyl?cylinderPoint:torusPoint;
  const quads=[];
  for(let i=0;i<ns;i++)for(let j=0;j<nt;j++){
    const a=i/ns,b=(i+1)/ns,c=j/nt,d=(j+1)/nt;
    const P=[point(a,c),point(b,c),point(b,d),point(a,d)];
    const midS=(a+b)/2,midT=(c+d)/2;
    const selected=(unionMode?placedCabinet(pageForProduct[name]).map(z=>z.value):[o]).some(q=>productMember(midS,q.s,q.rs,o.cyclicS)&&productMember(midT,q.t,q.rt,o.cyclicT));
    // depth variation darkens away from the viewer, but membership is computed in factor coordinates.
    const depth=P.reduce((k,q)=>k+q[2],0)/4;
    const tnorm=cyl?(depth+1)/2:(depth+150)/300;
    const underlying=tnorm>.55?'#b78632':'#946b2e';
    const color=selected?'#8296c1':underlying;
    quads.push({P,depth,color});
  }
  quads.sort((a,b)=>a.depth-b.depth);
  const fragment=document.createDocumentFragment();
  for(const q of quads)fragment.append(makeQuad(...q.P,q.color));
  g.append(fragment);
  if(cyl){
    for(const t of [0,1]){
      let d='';
      for(let i=0;i<=160;i++){
        const p=point(i/160,t);
        d+=(i?'L':'M')+p[0].toFixed(2)+' '+p[1].toFixed(2);
      }
      g.append(svgElement('path',{d,fill:'none',stroke:'#805d31','stroke-width':2.3,opacity:.8,'pointer-events':'none'}));
    }
  }
}
function torusFactorCenters(){
  // Desktop: one complete S^1 above the other, maintaining the original
  // 79-unit radius. Narrow screens retain the original horizontal layout.
  return window.matchMedia('(min-width:861px)').matches
    ?{s:{x:110,y:111,r:79},t:{x:110,y:340,r:79}}
    :{s:{x:145,y:192,r:79},t:{x:335,y:192,r:79}};
}
function syncTorusFactorFrames(){
  const svg=$('prodTorusFactors'),C=torusFactorCenters();
  const wide=window.matchMedia('(min-width:861px)').matches;
  const view=wide?'0 0 220 450':'55 40 370 320';
  if(svg.getAttribute('viewBox')!==view)svg.setAttribute('viewBox',view);
  const circles=svg.querySelectorAll('circle.factor-circle');
  const dots=svg.querySelectorAll('circle.factor-dot');
  for(const [i,k] of ['s','t'].entries()){
    if(circles[i]){
      circles[i].setAttribute('cx',C[k].x);
      circles[i].setAttribute('cy',C[k].y);
    }
    if(dots[i]){
      dots[i].setAttribute('cx',C[k].x);
      dots[i].setAttribute('cy',C[k].y-C[k].r);
    }
  }
}
function renderTorusFactors(o){
  syncTorusFactorFrames();
  const C=torusFactorCenters();
  drawFactorCircleArcs($('torusFactorArcsU'),C.s.x,C.s.y,C.s.r,productIntervals(o.s,o.rs,true),'factor-arc-u','s');
  drawFactorCircleArcs($('torusFactorArcsV'),C.t.x,C.t.y,C.t.r,productIntervals(o.t,o.rt,true),'factor-arc-v','t');
  drawFactorHandles($('torusFactorHandlesU'),C.s.x,C.s.y,C.s.r,o.s,o.rs,'s');
  drawFactorHandles($('torusFactorHandlesV'),C.t.x,C.t.y,C.t.r,o.t,o.rt,'t');
}
function renderTorusContours(o){
  const g=$('prodTorusContours'); if(!g) return; g.replaceChildren();
  // Hand-drawn contour language while keeping the seam mathematically aligned with s = 0 ~ 1.
  g.append(svgElement('path',{d:sketchCurve('s',0,.95,320,.07), class:'torus-seam'}));
  g.append(svgElement('path',{d:sketchCurve('s',0,.45,320,.19), class:'torus-sketched-soft', opacity:.55}));
  g.append(svgElement('path',{d:sketchCurve('t',0.77,.85,320,.33), class:'torus-sketched'}));
  g.append(svgElement('path',{d:sketchCurve('t',0.30,.65,320,.58), class:'torus-sketched-soft'}));
  g.append(svgElement('path',{d:sketchCurve('t',0.06,.55,320,.82), class:'torus-sketched-soft', opacity:.62}));
  g.append(svgElement('path',{d:sketchCurve('s',o.s,.55,240,.44), class:'torus-contour-soft', opacity:.68}));
  g.append(svgElement('path',{d:sketchCurve('t',o.t,.50,240,.61), class:'torus-contour-soft', opacity:.68}));
}
function renderProduct(name){
  renderProductAtlas(name);
  if(name==='Torus'){
    renderTorusFactors(productModels[name]);
    return;
  }
  const g=$('prod'+name+'ObjectMesh');
  if(!g) return;
  g.replaceChildren();
  if(name==='Square')renderProductSquare(productModels[name],g);
  else renderSurface(name,productModels[name],g);
}
// Dragging is initiated exclusively on the selected arc / endpoint.
// Moving through empty space, the unselected circle, or the square does nothing.
const productMinWidth=.055;
function updateIntervalEnd(o,axis,side,value){
  // Non-cyclic factor: permit an endpoint to travel a little BEYOND the
  // square. The selected open remains its intersection with [0,1].
  const rKey=axis==='s'?'rs':'rt',radius=o[rKey],center=o[axis];
  const left=center-radius,right=center+radius;
  const overshoot=.09;
  const a=side==='start'?clamp(value,-overshoot,right-productMinWidth):left;
  const b=side==='end'?clamp(value,left+productMinWidth,1+overshoot):right;
  o[axis]=(a+b)/2;
  o[rKey]=(b-a)/2;
}
function resizeCyclicFromTravel(o,axis,side,startCenter,startRadius,travel){
  // One endpoint stays fixed in the universal cover R -> S¹. Accumulated
  // travel (rather than a shortest-angle snapshot) allows crossing the seam
  // and passing a COMPLETE revolution without snapping back.
  const rKey=axis==='s'?'rs':'rt';
  const nextR=clamp(startRadius+(side==='start'?-travel:travel)/2,
    productMinWidth/2,PRODUCT_CYCLIC_MAX_RADIUS);
  const fixed=side==='start'?startCenter+startRadius:startCenter-startRadius;
  o[rKey]=nextR;
  o[axis]=((fixed+(side==='start'?-nextR:nextR))%1+1)%1;
}
function shiftInterval(o,axis,newCenter){
  const radius=axis==='s'?o.rs:o.rt;
  const cyclic=axis==='s'?o.cyclicS:o.cyclicT;
  // A full interval must not reopen accidentally when translated.
  o[axis]=cyclic?((newCenter%1)+1)%1
    : radius>=.5?clamp(newCenter,1-radius,radius)
    :clamp(newCenter,radius,1-radius);
}
// Page IV: the two circle factors. A pointerdown on an actual endpoint
// adjusts it; a pointerdown on the selected arc translates that arc.
(function(){
  const svg=$('prodTorusFactors'),o=productModels.Torus;
  let drag=null;
  svg.addEventListener('pointerdown',e=>{
    if(unionMode||page!==6||e.pointerType==='mouse'&&e.button!==0)return;
    const hit=e.target.closest('[data-factor-role]');
    if(!hit||!svg.contains(hit))return;
    const axis=hit.dataset.which,kind=hit.dataset.factorRole;
    if(axis!=='s'&&axis!=='t')return;
    const p=point(e,svg),c=torusFactorCenters()[axis];
    torusFreshCutId=null;renderProduct('Torus');
    drag={id:e.pointerId,axis,kind,side:hit.dataset.side,
      startParam:nearestOnFactorCircle(p,c.x,c.y),startCenter:o[axis],
      startRadius:o[axis==='s'?'rs':'rt'],prevParam:nearestOnFactorCircle(p,c.x,c.y),travel:0};
    svg.setPointerCapture(e.pointerId);
    e.preventDefault();e.stopPropagation();
  });
  svg.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.id||!(e.buttons&1)&&e.pointerType==='mouse')return;
    const p=point(e,svg),c=torusFactorCenters()[drag.axis];
    const next=nearestOnFactorCircle(p,c.x,c.y);
    drag.travel+=unwrapNear(next,drag.prevParam)-drag.prevParam;
    drag.prevParam=next;
    if(drag.kind==='endpoint')
      resizeCyclicFromTravel(o,drag.axis,drag.side,drag.startCenter,drag.startRadius,drag.travel);
    else shiftInterval(o,drag.axis,drag.startCenter+drag.travel);
    renderProduct('Torus');
    e.stopPropagation();
  });
  function end(e){if(drag&&e.pointerId===drag.id)drag=null;}
  svg.addEventListener('pointerup',end);
  svg.addEventListener('pointercancel',end);
  svg.addEventListener('lostpointercapture',end);
  // Scrolling sizes a circle interval only when over its selected arc.
  svg.addEventListener('wheel',e=>{
    if(unionMode||page!==6)return;
    const hit=e.target.closest('[data-factor-role]');
    if(!hit||!svg.contains(hit))return;
    e.preventDefault();
    const axis=hit.dataset.which,rKey=axis==='s'?'rs':'rt';
    torusFreshCutId=null;
    o[rKey]=clamp(o[rKey]*wheelRatio(e),.035,PRODUCT_CYCLIC_MAX_RADIUS);
    renderProduct('Torus');
  },{passive:false});
})();

// Page III (and the torus coordinate chart): only the *selected factor
// intervals* can be dragged. Empty parts of the chart are never controls.
for(const name of Object.keys(productModels)){
  const svg=$('prod'+name+'Atlas'),o=productModels[name];
  const activePage=pageForProduct[name];
  let drag=null;
  const toParam=(axis,p)=>axis==='s'
    ?(p.x-PR.x)/PR.size
    :1-(p.y-PR.y)/PR.size;
  svg.addEventListener('pointerdown',e=>{
    if(unionMode||page!==activePage||e.pointerType==='mouse'&&e.button!==0)return;
    const hit=e.target.closest('[data-product-role]');
    if(!hit||!svg.contains(hit))return;
    const axis=hit.dataset.axis,kind=hit.dataset.productRole;
    if(kind!=='move-rectangle' && axis!=='s'&&axis!=='t')return;
    if(kind==='move-rectangle' && name!=='Square')return;
    const p=point(e,svg);
    if(name==='Torus'){torusFreshCutId=null;renderProduct('Torus');}
    drag=kind==='move-rectangle'
      ?{id:e.pointerId,kind,startX:p.x,startY:p.y,startS:o.s,startT:o.t}
      :{id:e.pointerId,axis,kind,side:hit.dataset.side,
        startParam:toParam(axis,p),startCenter:o[axis],
        startRadius:o[axis==='s'?'rs':'rt'],prevParam:toParam(axis,p),travel:0};
    svg.setPointerCapture(e.pointerId);
    e.preventDefault();e.stopPropagation();
  });
  svg.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.id||!(e.buttons&1)&&e.pointerType==='mouse')return;
    const p=point(e,svg);
    if(drag.kind==='move-rectangle'){
      // Shift the *chosen basis element* in both factors, not its size.
      // Keeping the initial grab offset prevents jumping on pointerdown.
      shiftInterval(o,'s',drag.startS+(p.x-drag.startX)/PR.size);
      shiftInterval(o,'t',drag.startT-(p.y-drag.startY)/PR.size);
    }else{
      const next=toParam(drag.axis,p);
      if(drag.kind==='endpoint'){
        if(name==='Torus'){
          // The square chart has a cut at 0~1: unwrap small crossings.
          drag.travel+=unwrapNear(next,drag.prevParam)-drag.prevParam;
          drag.prevParam=next;
          resizeCyclicFromTravel(o,drag.axis,drag.side,drag.startCenter,drag.startRadius,drag.travel);
        }else updateIntervalEnd(o,drag.axis,drag.side,next);
      }else shiftInterval(o,drag.axis,drag.startCenter+next-drag.startParam);
    }
    renderProduct(name);
    e.stopPropagation();
  });
  function end(e){if(drag&&e.pointerId===drag.id)drag=null;}
  svg.addEventListener('pointerup',end);
  svg.addEventListener('pointercancel',end);
  svg.addEventListener('lostpointercapture',end);
  // Third page: wheel scaling works anywhere on either whole bar. On the
  // torus chart, preserve the existing selected-interval wheel behavior.
  // A wheel event never begins a drag or relocates the selected neighborhood.
  svg.addEventListener('wheel',e=>{
    if(unionMode||page!==activePage)return;
    const selector=name==='Square'
      ?'[data-product-role], [data-wheel-axis]'
      :'[data-product-role]';
    const hit=e.target.closest(selector);
    if(!hit||!svg.contains(hit))return;
    // Page III: wheel over the cream U×V changes *both* interval radii,
    // keeping its center fixed. Bar scrolling still changes one factor only.
    if(name==='Square'&&hit.dataset.productRole==='move-rectangle'){
      e.preventDefault();
      const ratio=wheelRatio(e);
      o.rs=clamp(o.rs*ratio,.035,PRODUCT_INTERVAL_MAX_RADIUS);
      o.rt=clamp(o.rt*ratio,.035,PRODUCT_INTERVAL_MAX_RADIUS);
      renderProduct(name);
      return;
    }
    const axis=hit.dataset.axis||hit.dataset.wheelAxis;
    if(axis!=='s'&&axis!=='t')return;
    e.preventDefault();
    const rKey=axis==='s'?'rs':'rt';
    if(name==='Torus')torusFreshCutId=null;
    o[rKey]=clamp(o[rKey]*wheelRatio(e),.035,productRadiusLimit(o,axis));
    renderProduct(name);
  },{passive:false});
  renderProduct(name);
}
// The whole coloured math workbench belongs to its mathematical controls,
// just as on the quotient page. A selected bar/arc keeps its axis-specific
// wheel handler; a wheel elsewhere in the workbench expands BOTH factors,
// except over the torus circle display (which chooses its nearer circle).
for(const name of ['Square','Torus']){
  const exhibit=$('prod'+name+'Exhibit');
  const o=productModels[name], activePage=pageForProduct[name];
  for(const board of exhibit.querySelectorAll('.space')){
    board.addEventListener('wheel',e=>{
      if(e.defaultPrevented||unionMode||page!==activePage||e.ctrlKey||e.metaKey)return;
      const raw=Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX;
      if(!Number.isFinite(raw)||Math.abs(raw)<1e-5)return;
      e.preventDefault();e.stopPropagation();
      const ratio=wheelRatio({deltaY:raw,deltaMode:e.deltaMode});
      let axes=['s','t'];
      if(name==='Torus' && board.contains($('prodTorusFactors'))){
        const p=point(e,$('prodTorusFactors')),C=torusFactorCenters();
        const ds=Math.hypot(p.x-C.s.x,p.y-C.s.y);
        const dt=Math.hypot(p.x-C.t.x,p.y-C.t.y);
        axes=[ds<=dt?'s':'t'];
      }
      if(name==='Torus')torusFreshCutId=null;
      for(const axis of axes){
        const k=axis==='s'?'rs':'rt';
        o[k]=clamp(o[k]*ratio,.035,productRadiusLimit(o,axis));
      }
      renderProduct(name);
    },{passive:false});
  }
}
window.addEventListener('resize',()=>renderTorusFactors(productModels.Torus));
// All palette and specimen collections are initialized before first render.
renderQuotient(); renderAnnulus(); paintAnnulusSaved();
flip(0);
controlsRefresh();
paintAllUnions();

})();
</script>
